# The devkit's checks on every pull request and on main and dev. No secrets
# and read-only access.
#
#   make check        the tests a computer without a container runtime can
#                     run, on Linux and macOS, and the analysers on Linux
#   make check-full   every test, none skipped, on Linux ARM64: the build
#                     environment, the sample built and packed, the engine
name: Checks

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: e2fsprogs (the card tool's mke2fs and debugfs)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends e2fsprogs
          else
            brew install e2fsprogs
          fi
      - name: MUN OS's tools at the pinned revision
        run: ./mdk os fetch
      - name: The analysers, pinned by hash
        if: runner.os == 'Linux'
        run: make dev-tools
      - name: make check
        run: make check
      - name: make analyse
        if: runner.os == 'Linux'
        run: make analyse
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck engines/godot/fetch.sh

  check-full:
    name: make check-full (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: e2fsprogs (the card tool's mke2fs and debugfs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends e2fsprogs
      - name: MUN OS's tools at the pinned revision
        run: ./mdk os fetch
      - name: What this computer has
        run: ./mdk doctor
      - name: The build environment
        run: ./mdk env build
      - name: The sample, built and packed
        run: make sample
      - name: The pinned engine
        run: engines/godot/fetch.sh
      - name: The analysers, pinned by hash
        run: make dev-tools
      - name: make check-full
        run: make check-full
      - name: make analyse
        run: make analyse
