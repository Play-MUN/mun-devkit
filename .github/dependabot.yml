# The actions the workflows use are pinned by commit; this proposes the
# newer ones, once a week, as pull requests against dev.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
